; DanmaX 配置文件（UTF-8 编码）
; 首次运行自动创建；界面修改即时生效并保存，数值输入合并 200 毫秒后写盘。
; 手动修改前请退出所有程序实例；启动时读取，不监视外部文件修改。
; 保存时重建程序自带的中文说明、分组与已知字段，不保留额外注释或未知字段。
; 布尔值写 true/false（读取也接受 1/0），小数使用英文句点。
; 字符串保留双引号；反斜杠写成两个，双引号写成反斜杠加双引号。
; 字符串开头的 @ 在文件中写为 @@；文件路径建议使用正斜杠。
; 缺失字段使用默认值；无效字段提示错误并使用默认值，首次覆盖前备份原文件。

[Online]
; 按顺序使用的匿名弹弹play兼容服务，失败或无结果时回退；各服务共享动画/剧集 ID。
; JSON 数组字符串，空列表为 "[]"；旧 danmakuServer 不读取、不迁移。
; 支持 http/https 和路径前缀，不包含 /api/v2、查询参数或账号密码。
danmakuServers="[\"https://danmaku-api.152468.xyz\"]"
; 只读取本文件；旧 settings.json 和旧版 INI 不导入、不转换。

[Meta]
; 本格式版本：1。请勿删除此项；其他版本不自动迁移。
formatVersion=1

[Appearance]
; 应用主题：system=跟随系统，light=浅色，dark=深色。默认：system。
; Windows 高对比度启用时优先跟随系统，不强制浅色或深色。
theme="system"

; 弹幕字体名称，默认：Microsoft YaHei（微软雅黑）。不能为空，最多 4096 字符。
; 使用系统已安装字体；缺失字形由 Qt 和系统字体回退处理，不随程序分发字体。
fontFamily="Microsoft YaHei"

; 普通弹幕的基准字号，单位：逻辑像素；整数 10～72，默认：24。
; XML 字号以 25 为基准按比例缩放，因此源文件中的小字和大字仍有区别。
fontSize=24

; 弹幕文字描边宽度，单位：逻辑像素；整数 0～6，默认：1，0 表示不描边。
strokeWidth=1

; 弹幕不透明度，范围：0.05～1.0，默认：0.85（85%）。
; 数值越小越透明；只影响弹幕，不改变控制面板的不透明度。
opacity=0.85

[Danmaku]
; 滚动弹幕速度，单位：逻辑像素/秒；整数 30～1500，默认：180。
; 暂停时位置冻结；修改速度不会重新加载 XML 或清空全部在屏弹幕。
speed=180

; 顶部、底部固定弹幕的显示时长，单位：秒；范围：1～30，默认：5。
; 暂停时间不计入寿命；缩短时长可能让已达到新时限的固定弹幕立即退场。
fixedSeconds=5

; 最大在屏弹幕数量，整数 50～5000，默认：500。
; 这是资源容量上限，不是流畅度保证；减少容量时保留较早在场对象。
maxActive=500

; 最大轨道数量，整数 1～60，默认：18。
; 实际可用轨道还受屏幕高度、字体、字号、描边和行距限制。
maxTracks=18

; 轨道额外行距比例，范围：0～2，默认：0.2（20%）。
; 该值是比例，不是像素数；值越大，同样高度内的可用轨道越少。
lineSpacing=0.2

; 轨道已满时是否允许重叠：true=允许，false=禁止，默认：false。
; 无论是否开启都优先使用安全轨道；禁止重叠且无可用位置时丢弃新弹幕。
overlap=false

[Rendering]
; 文字图片预算模式：true=按当前活动弹幕需求自动调整，false=手动固定预算。默认：true。
; 自动从最多 64 MiB 起步，预留 25% 余量并分档增长，持续低需求 10 秒后收缩；不查询系统可用显存。
textureBudgetAuto=true

; 文字图片容量上限，单位：MiB；整数 32～1024，默认：512。
; 自动模式为增长上限，手动模式为固定预算，不提前分配；仅估算图片内容，不含 Qt 图集和驱动开销。
; 超出上限的弹幕回退文字绘制；调低时释放超额图片，停止时清空项目资源。每帧准备限制保持独立。
textureBudgetMiB=512

[Sync]
; 弹幕相对媒体的时间偏移，单位：秒；范围：-120～120，默认：0。
; 正值提前显示，负值延后显示；支持小数，例如 0.5 表示提前半秒。
timeOffset=0

; 选定的 Windows SMTC 媒体会话 ID，默认：空字符串（未选择）。
; 由播放页选择播放器后保存，必须匹配会话 ID，不是媒体标题。
targetSession=""

[Window]
; 弹幕显示器索引，整数 0～32，默认：0（系统枚举的第一台）。
; 按播放时的显示器列表选择；显示器断开或索引越界时使用可用显示器。
screenIndex=0

; 覆盖窗置顶策略，整数 0～3，默认：1。
; 0=不置顶；1=置顶；2=周期保持置顶；3=先取消再恢复置顶的兼容策略。
; 不保证覆盖独占全屏、受保护视频或其他置顶窗口。
onTop=1

; 仅所选播放器在前台时显示：true=开启，false=关闭，默认：false。
; 用于媒体同步模式；无法关联媒体会话与前台窗口时请关闭，独立播放不受此项限制。
foregroundOnly=false

[Diagnostics]
; 在覆盖层显示调试信息：true=显示，false=隐藏，默认：false。
debug=false

; 调试信息位置：top_left=左上，top_right=右上，bottom_left=左下，bottom_right=右下。
; 默认：top_left。仅在 debug=true 时显示。
debugPosition="top_left"

[Logging]
; 日志最低级别：DEBUG、INFO、WARNING、ERROR，默认：INFO。
; 按上述顺序过滤；DEBUG 最详细，ERROR 只保留错误。
logLevel="INFO"

; 是否写入 app.log：true=写入，false=只保留界面日志，默认：true。
; 单文件上限 2 MiB，保留一份 app.log.1 轮转备份。
logToFile=true

[Playback]
; 最近加载的 XML 路径，默认：空字符串；由加载文件操作自动保存。
; 启动时只恢复路径显示，不自动加载或播放；文件移动后请重新选择。
; 手动填写建议使用正斜杠，如 D:/弹幕/example.xml，含逗号或分号的路径必须保留双引号。
lastFile=""
